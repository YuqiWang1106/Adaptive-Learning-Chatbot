[pytest]
DJANGO_SETTINGS_MODULE = learning_django.settings_test
python_files = test_*.py
testpaths =
    tests
addopts = --strict-config --strict-markers
markers =
    live: requires explicit authorization and a real isolated staging target
    browser: drives real browser engines without mocked product APIs
    security: performs active security checks against isolated staging
    load: creates concurrent traffic and may spend model budget
